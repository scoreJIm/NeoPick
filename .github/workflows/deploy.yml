name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setter-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn verify -B

      - name: Build Docker image
        run: docker build -t neopick-api:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Push to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}
          docker tag neopick-api:${{ github.sha }} ${{ secrets.ECR_REPOSITORY }}:neopick-api-${{ github.sha }}
          docker push ${{ secrets.ECR_REPOSITORY }}:neopick-api-${{ github.sha }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster neopick --service neopick-api --force-new-deployment
          aws ecs wait services-stable --cluster neopick --services neopick-api
