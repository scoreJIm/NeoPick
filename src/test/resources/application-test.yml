spring:
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neopick_test}
    driver-class-name: org.postgresql.Driver
    username: ${TEST_DATASOURCE_USERNAME:neopick}
    password: ${TEST_DATASOURCE_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms
  sql:
    init:
      mode: never

neopick:
  jwt:
    secret: test-secret-at-least-256-bits-long-for-hs256-algorithm
  sms:
    provider: mock
  aws:
    region: us-east-1
    s3:
      bucket: neopick-test
    sns:
      booking-events-topic: arn:aws:sns:us-east-1:000000000000:neopick-test-booking-events
  s3:
    bucket: neopick-test
    region: us-east-1
    presign-upload-duration: 300
    presign-download-duration: 3600
  cdn:
    domain: https://cdn.neopick.test
  media:
    max-file-size: 5242880
    allowed-types: image/jpeg,image/png,image/webp

logging:
  level:
    com.neopick: WARN
    org.springframework: WARN
