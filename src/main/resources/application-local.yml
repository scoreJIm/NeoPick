# Local development profile — uses H2 in memory, mock services, debug logging
spring:
  datasource:
    url: jdbc:h2:mem:neopick;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379

neopick:
  jwt:
    secret: local-dev-only-do-not-use-in-production
  sms:
    provider: mock
  aws:
    region: us-east-1
    s3:
      bucket: neopick-local-media
    sns:
      booking-events-topic: arn:aws:sns:us-east-1:000000000000:neopick-local-booking-events

logging:
  level:
    com.neopick: DEBUG
    org.springframework.web: DEBUG
