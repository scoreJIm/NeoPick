spring:
  application:
    name: neopick-api
  profiles:
    active: dev
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: neopick-api
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      slo:
        http:
          server:
            requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http

neopick:
  jwt:
    access-token-expiration: 2h
    refresh-token-expiration: 30d
  sms:
    code-length: 6
    code-ttl: 300
    resend-cooldown: 60
    daily-limit: 5
  booking:
    pending-confirm-timeout: 24h
    pending-pay-timeout: 2h
