spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/neopick
    username: neopick
    password: neopick_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

neopick:
  jwt:
    secret: dev-secret-key-change-in-production-must-be-at-least-256-bits
  sms:
    provider: mock
  aws:
    region: us-east-1
    s3:
      bucket: neopick-dev-media
    sns:
      booking-events-topic: arn:aws:sns:us-east-1:000000000000:neopick-dev-booking-events

logging:
  level:
    com.neopick: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
