# NEOPick Sealed Secret
# ---------------------
# This file contains encrypted secrets sealed with kubeseal.
# Only the target cluster's controller can decrypt these values.
#
# Setup:
#   1. Install kubeseal CLI: https://github.com/bitnami-labs/sealed-secrets#installation
#   2. Install Sealed Secrets controller in cluster:
#        helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#        helm install sealed-secrets sealed-secrets/sealed-secrets --namespace kube-system
#   3. Encrypt your plaintext secret:
#        kubectl create secret generic neopick-api-secret \
#          --from-env-file=.env.prod \
#          --dry-run=client -o yaml | \
#          kubeseal --format yaml > k8s/sealed-secret.yaml
#   4. Apply:
#        kubectl apply -f k8s/sealed-secret.yaml
#
# Rotating a single key:
#   Edit .env.prod, re-run step 3, and apply. The SealedSecret controller
#   will update the Kubernetes Secret automatically.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: neopick-api-secret
  namespace: default
  labels:
    app.kubernetes.io/name: neopick-api
    app.kubernetes.io/part-of: neopick
spec:
  encryptedData:
    SPRING_DATASOURCE_USERNAME: AgAAAA...  # placeholder - replace with kubeseal output
    SPRING_DATASOURCE_PASSWORD: AgAAAA...  # placeholder
    SPRING_DATA_REDIS_PASSWORD: AgAAAA...  # placeholder
    NEOPICK_JWT_SECRET: AgAAAA...  # placeholder
    NEOPICK_ALIYUN_SMS_ACCESS_KEY: AgAAAA...  # placeholder
    NEOPICK_ALIYUN_SMS_SECRET_KEY: AgAAAA...  # placeholder
    NEOPICK_WECHAT_APP_ID: AgAAAA...  # placeholder
    NEOPICK_WECHAT_API_KEY: AgAAAA...  # placeholder
    NEOPICK_ALIPAY_APP_ID: AgAAAA...  # placeholder
    NEOPICK_ALIPAY_PRIVATE_KEY: AgAAAA...  # placeholder
    AWS_ACCESS_KEY_ID: AgAAAA...  # placeholder
    AWS_SECRET_ACCESS_KEY: AgAAAA...  # placeholder
