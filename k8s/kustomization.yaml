apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - prometheus-rules.yaml

# =============================================================================
# Production Secrets (uncomment ONE of the options below)
# =============================================================================
#
# Option A: Sealed Secrets (encrypted secrets safe to commit to Git)
#   Prerequisites: Sealed Secrets controller installed + kubeseal CLI
#   Setup: ./scripts/secrets-setup.sh sealed
#   Docs:  docs/SECRETS.md
#
#   - sealed-secret.yaml
#
# Option B: External Secrets Operator with AWS Secrets Manager
#   Prerequisites: ESO installed + AWS credentials + secrets in AWS SM
#   Setup: ./scripts/secrets-setup.sh eso
#   Docs:  docs/SECRETS.md
#
#   - secret-store.yaml
#   - external-secret.yaml
#
# Option C: HashiCorp Vault (not included in kustomization by default)
#   Setup: ./scripts/secrets-setup.sh vault
#   Docs:  docs/SECRETS.md
#
# IMPORTANT: When using any production option, remove or comment out
# the secretGenerator block below to avoid overriding the managed Secret.
# =============================================================================

commonLabels:
  app.kubernetes.io/name: neopick-api
  app.kubernetes.io/part-of: neopick

images:
  - name: ${ECR_REGISTRY}/neopick-api
    newTag: ${IMAGE_TAG}

configMapGenerator:
  - name: neopick-api-config
    behavior: replace
    literals:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_DATA_REDIS_PORT=6379
      - NEOPICK_SMS_PROVIDER=aliyun
      - NEOPICK_PAYMENT_PROVIDERS=wechat,alipay
      - NEOPICK_JWT_ACCESS_EXPIRATION_MINUTES=30
      - NEOPICK_JWT_REFRESH_EXPIRATION_DAYS=7

secretGenerator:
  - name: neopick-api-secret
    behavior: replace
    literals:
      - placeholder=true
