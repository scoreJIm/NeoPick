apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: neopick-alerts
  labels:
    app: neopick-api
    release: prometheus
spec:
  groups:
    - name: neopick
      rules:
        - alert: NeopickHighErrorRate
          expr: rate(http_server_requests_seconds_count{app="neopick-api",status=~"5.."}[5m]) / rate(http_server_requests_seconds_count{app="neopick-api"}[5m]) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NEOPick error rate > 1%"
            description: "5xx rate is {{ $value | humanizePercentage }} over last 5min"

        - alert: NeopickHighLatency
          expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{app="neopick-api"}[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "NEOPick P99 latency > 2s"
            description: "P99 latency is {{ $value }}s"

        - alert: NeopickBookingFailureRate
          expr: rate(neopick_booking_failed_total[10m]) / rate(neopick_booking_submitted_total[10m]) > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "NEOPick booking failure rate > 5%"

        - alert: NeopickCircuitBreakerOpen
          expr: neopick_circuitbreaker_state{state="OPEN"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "NEOPick circuit breaker {{ $labels.name }} is OPEN"

        - alert: NeopickRedisDown
          expr: redis_connected_clients{app="neopick-api"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "NEOPick cannot connect to Redis"

        - alert: NeopickDatabaseDown
          expr: hikaricp_connections_active{app="neopick-api"} < 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "NEOPick database connection pool exhausted"

        - alert: NeopickHighPodCPU
          expr: container_cpu_usage_seconds_total{pod=~"neopick-api-.*"} / container_spec_cpu_quota{pod=~"neopick-api-.*"} > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NEOPick CPU > 85%"
