# NEOPick External Secret (External Secrets Operator)
# ----------------------------------------------------
# This configuration tells the External Secrets Operator (ESO) to sync
# secrets from an external provider into a Kubernetes Secret named
# "neopick-api-secret".
#
# Prerequisites:
#   1. Install ESO:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          --namespace external-secrets-system --create-namespace
#   2. Create the SecretStore (see k8s/secret-store.yaml)
#   3. Populate the external provider (AWS Secrets Manager / HashiCorp Vault / etc.)
#      with the secret values under the keys and properties listed below.
#   4. Apply:
#        kubectl apply -f k8s/secret-store.yaml
#        kubectl apply -f k8s/external-secret.yaml
#
# The ESO controller will periodically refresh the Kubernetes Secret
# based on refreshInterval. The Deployment mounts it via secretRef as normal.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: neopick-api-external-secret
  namespace: default
  labels:
    app.kubernetes.io/name: neopick-api
    app.kubernetes.io/part-of: neopick
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: neopick-api-secret
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: neopick/prod/database
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: neopick/prod/database
        property: password
    - secretKey: SPRING_DATA_REDIS_PASSWORD
      remoteRef:
        key: neopick/prod/redis
        property: password
    - secretKey: NEOPICK_JWT_SECRET
      remoteRef:
        key: neopick/prod/jwt
        property: secret
    - secretKey: NEOPICK_ALIYUN_SMS_ACCESS_KEY
      remoteRef:
        key: neopick/prod/sms
        property: access-key
    - secretKey: NEOPICK_ALIYUN_SMS_SECRET_KEY
      remoteRef:
        key: neopick/prod/sms
        property: secret-key
    - secretKey: NEOPICK_WECHAT_APP_ID
      remoteRef:
        key: neopick/prod/wechat
        property: app-id
    - secretKey: NEOPICK_WECHAT_API_KEY
      remoteRef:
        key: neopick/prod/wechat
        property: api-key
    - secretKey: NEOPICK_ALIPAY_APP_ID
      remoteRef:
        key: neopick/prod/alipay
        property: app-id
    - secretKey: NEOPICK_ALIPAY_PRIVATE_KEY
      remoteRef:
        key: neopick/prod/alipay
        property: private-key
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: neopick/prod/aws
        property: access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: neopick/prod/aws
        property: secret-access-key
