# NEOPick Secret Store (AWS Secrets Manager)
# -------------------------------------------
# This SecretStore tells the External Secrets Operator how to authenticate
# against AWS Secrets Manager to retrieve secrets.
#
# Prerequisites:
#   1. Create the aws-credentials secret with your AWS access keys:
#        kubectl create secret generic aws-credentials \
#          --from-literal=access-key-id=AKIAIOSFODNN7EXAMPLE \
#          --from-literal=secret-access-key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#   2. Ensure the AWS IAM user has permissions for:
#        - secretsmanager:GetSecretValue
#        - secretsmanager:DescribeSecret
#      on the secrets under the neopick/ prefix.
#   3. Apply:
#        kubectl apply -f k8s/secret-store.yaml
#
# For HashiCorp Vault, replace the provider block with:
#   provider:
#     vault:
#       server: "https://vault.example.com"
#       path: "secret"
#       version: "v2"
#       auth:
#         kubernetes:
#           mountPath: "kubernetes"
#           role: "neopick-api"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
